# postgresql.conf additions for benchmarking pgvector HNSW and SVS Vamana on a
# 1M x 1536-d dataset (dbpedia-cal-pgvector-*) on a 16-vCPU / 123 GB server
# with the data directory in /dev/shm and the benchmark client on another
# host. Scaled from pgsvs-server-bench.conf and the pgv-svs-dev-scripts
# 16-vCPU SVS config (postgresql_svs_r8i.4xl.conf). Use with
# tests/pgsvs-server.sh and PGSVS_SEARCH_THREADS=13 (as in those scripts).

shared_preload_libraries = 'vector, svs'

# 100 search clients plus build and upload connections.
max_connections = 300

# The data directory itself is RAM (tmpfs), so keep the buffer cache moderate:
# ~6 GB table + ~7 GB HNSW index fit.
shared_buffers = 24GB
effective_cache_size = 64GB
huge_pages = try
work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# WAL lives in tmpfs too; bounded to leave room for table, index and SVS files.
wal_buffers = 32MB
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 1h

# No background vacuum/analyze competing with measured phases.
autovacuum = off

# Background workers: the svs launcher, one worker per enrolled database, and
# the parallel pool. The 13 granted SVS search threads stay parked in
# max_parallel_workers, so the pool must also cover the 16-worker builds.
max_worker_processes = 48
max_parallel_workers = 32
# Index builds (the DBpedia configs leave both to the server).
max_parallel_maintenance_workers = 16
maintenance_work_mem = 16GB

# SVS memory budgets (defaults are 100 MB / 4 GB, far below a 1M x 1536 index).
svs.max_residency_memory = 32GB
svs.default_residency_memory = 32GB
svs.max_build_memory = 32GB
svs.max_search_work_mem = 4GB
svs.default_search_work_mem = 4GB
# Above the WAL retained across the update phases; past this the index's
# replication slot is dropped and the index rebuilt from the heap.
svs.max_slot_wal_size = 16GB
