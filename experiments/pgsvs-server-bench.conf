# postgresql.conf additions for benchmarking pgvector HNSW and SVS Vamana on a
# 1M x 1536-d dataset (dbpedia-cal-pgvector-*), on a 2 x 28-core / 187 GB host
# that also runs the benchmark client. Use with tests/pgsvs-server.sh:
#
#   PGSVS_BIN=<pg bin dir> PGSVS_DATA=<data dir> PGSVS_SEARCH_THREADS=48 \
#   PGSVS_CONF=experiments/pgsvs-server-bench.conf tests/pgsvs-server.sh start

# Settings below follow the pgv-svs-dev-scripts SVS server config
# (postgresql_svs_r8i.4xl.conf), scaled to this host.

# 'vector' preloaded too, so pgvector GUCs and hooks exist at startup.
shared_preload_libraries = 'vector, svs'

# 100 search clients plus build and upload connections.
max_connections = 300

shared_buffers = 32GB
effective_cache_size = 128GB
huge_pages = try
work_mem = 1GB
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# The COPY load and the update phases write ~6 GB of vectors.
wal_buffers = 32MB
max_wal_size = 64GB
min_wal_size = 4GB
checkpoint_timeout = 1h

# No background vacuum/analyze competing with measured phases.
autovacuum = off

# Background workers: the svs launcher, one worker per enrolled database, and
# the parallel pool. Granted SVS search threads (vamana_databases.search_num_threads)
# stay parked in max_parallel_workers, so the pool must also cover the
# 48-worker index builds the configs request.
max_worker_processes = 128
max_parallel_workers = 112
max_parallel_maintenance_workers = 48

# SVS memory budgets (defaults are 100 MB / 4 GB, far below a 1M x 1536 index).
svs.max_residency_memory = 96GB
svs.default_residency_memory = 96GB
svs.max_build_memory = 64GB
svs.max_search_work_mem = 8GB
svs.default_search_work_mem = 8GB
# Above the WAL retained across the load and update phases; past this the
# index's replication slot is dropped and the index rebuilt from the heap.
svs.max_slot_wal_size = 64GB
