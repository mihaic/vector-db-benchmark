# postgresql.conf additions that reproduce the pgv-svs-dev-scripts server
# settings for a 16-vCPU / 128 GB r8i.4xlarge (postgresql_svs_r8i.4xl.conf at
# pgv-svs-dev-scripts c9ae841), for comparing against
# pgsvs-server-bench-16vcpu.conf. Use with tests/pgsvs-server.sh (or
# scripts/pgvector-svs-aws/server.sh with PGSVS_CONF set in server.env), which
# sets listen_addresses, port and wal_level, and enrolls the database.
#
# Left out of the dev-scripts file: listen_addresses (the start script binds
# the private IP), svs.launcher_database = 'vamana_test' (our enrolled
# database is postgres, the default), and the locale, timezone and datestyle
# settings, which don't affect performance.
#
# Added: the svs memory budgets. The dev-scripts file predates them (svs
# d31f22d, 2026-09-11), and their 100 MB defaults cannot hold a 1M x 1536
# index.

shared_preload_libraries = 'vector, svs'

# svs
svs.worker_timeout_ms = 5000
svs.max_batch_size = 0
# Cluster default; tests/pgsvs-server.sh also enrolls the database with
# PGSVS_SEARCH_THREADS (13 in server.sh), which takes precedence.
svs.search_num_threads = 13

# WAL and checkpoints
wal_level = logical
synchronous_commit = on
wal_buffers = 32MB
checkpoint_timeout = 1h
checkpoint_warning = 1
max_wal_size = 8GB
min_wal_size = 1GB
max_wal_senders = 0

# Planner
random_page_cost = 1.1
cpu_tuple_cost = 0.013

# Logging. 'log' writes only LOG, FATAL and PANIC messages: ERROR and WARNING
# lines (rejected svs inserts, "SVS dynamic add points failed") are not
# logged.
log_min_messages = log

# Autovacuum
autovacuum = off
autovacuum_max_workers = 1
autovacuum_naptime = 1h
autovacuum_vacuum_threshold = 100000
autovacuum_analyze_threshold = 100000
autovacuum_vacuum_scale_factor = 0.5
autovacuum_analyze_scale_factor = 0.5

# Memory
dynamic_shared_memory_type = posix
shared_buffers = 32GB
work_mem = 1GB
effective_cache_size = 96GB
effective_io_concurrency = 200
maintenance_io_concurrency = 200
temp_buffers = 64MB
huge_pages = try
huge_page_size = 2MB
maintenance_work_mem = 6GB

# Connections and workers. The benchmark's 100 client connections use all of
# max_connections (as superuser, including the reserved slots). The 13 parked
# SVS search threads come out of max_parallel_workers, leaving 3 for builds.
max_connections = 100
max_parallel_workers = 16
max_worker_processes = 50
max_parallel_maintenance_workers = 8
max_parallel_workers_per_gather = 4

# svs memory budgets (not in dev-scripts; as in pgsvs-server-bench-16vcpu.conf).
svs.max_residency_memory = 32GB
svs.default_residency_memory = 32GB
svs.max_build_memory = 32GB
svs.max_search_work_mem = 4GB
svs.default_search_work_mem = 4GB
