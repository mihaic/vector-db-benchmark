# postgresql.conf additions for benchmarking pgvector HNSW alone (no svs) on a
# 1M x 1536-d dataset (dbpedia-cal-pgvector-hnsw-*) on a 16-vCPU / 123 GB
# server with the data directory in /dev/shm and the benchmark client on
# another host. Use with tests/pgsvs-server.sh and PGSVS_NO_SVS=1 (in
# scripts/pgvector-svs-aws/server.env: PGSVS_NO_SVS=1 and PGSVS_CONF pointing
# here). Compare with pgsvs-server-bench-16vcpu.conf, which shares the server
# with svs.

shared_preload_libraries = 'vector'
# The standard production level; only svs needs 'logical'.
wal_level = replica

# 100 search clients plus build and upload connections.
max_connections = 150

# Table (~7 GB: STORAGE PLAIN puts one 6 KB vector per 8 KB page) plus the
# HNSW index (~8 GB, ~9 GB after the 100k inserts) fit in the buffer cache.
shared_buffers = 24GB
effective_cache_size = 64GB
huge_pages = try
work_mem = 64MB
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# Parallel HNSW build: 15 workers plus the leader on 16 vCPUs. Without svs
# nothing is parked in the pool, so it only has to cover the build.
max_worker_processes = 24
max_parallel_workers = 16
max_parallel_maintenance_workers = 15
# The whole graph must fit, or pgvector falls back to a much slower build
# ("hnsw graph no longer fits into maintenance_work_mem").
maintenance_work_mem = 16GB

# HNSW index scans don't run in parallel, and with 100 concurrent clients on
# 16 vCPUs a parallel plan elsewhere would only oversubscribe.
max_parallel_workers_per_gather = 0
# JIT compilation only adds latency to short vector queries.
jit = off

# WAL lives in tmpfs too.
wal_buffers = 64MB
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 1h
checkpoint_completion_target = 0.9
synchronous_commit = on

# No background vacuum/analyze competing with measured phases.
autovacuum = off
